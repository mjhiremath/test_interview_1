name: Build and Deploy application
on:
  push:
    branches:
      - main
  workflow_dispatch:
env:
  DOCKERHUB_REPO: "mjhiremath776/github_image"
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: pytest -v
  build_image:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Generate Image Tag
        id: image_tag
        run: |
          echo "image_tag=$GITHUB_SHA" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        run: |
            echo ${{ env.DOCKERHUB_REPO }}:${{ steps.image_tag.outputs.image_tag }}
            docker build -t ${{ env.DOCKERHUB_REPO }}:${{ steps.image_tag.outputs.image_tag }} .
            docker push ${{ env.DOCKERHUB_REPO }}:${{ steps.image_tag.outputs.image_tag }}
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
  Deploy:
    needs: build_image
    runs-on: self-hosted
    steps:
      - name: code checkout
        uses: actions/checkout@v5
      - name: create docker registry secret for k8
        run: |
          kubectl create secret docker-registry dockerhub-secret \
          --docker-server=https://index.docker.io/v2/ \
          --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
          --docker-password=${{ secrets.DOCKERHUB_TOKEN }} \
          --dry-run=client -o yaml | kubectl apply -f -
      - name: deploy to kubernetes
        run: |
          helm upgrade --install gist-app ./k8s-gist \
          --set image.repository=${{ env.DOCKERHUB_REPO }} \
          --set image.tag=${{ needs.build_image.outputs.image_tag }} \
          --set 'imagePullSecrets[0].name=dockerhub-secret'
          kubectl rollout status deployment/gist-app-k8s-gist
          
